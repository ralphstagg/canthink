<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fibro Flare Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style id="app-style">
/* Layout: one calm column of cards; a sticky jump bar; the flare checklist first, the plan second, the log last. */
:root{
  --bg:#f3f1f5;
  --surface:#ffffff;
  --ink:#2a2233;
  --muted:#6b6175;
  --line:#ddd6e3;
  --accent:#2f6f6a;
  --accent-soft:#e1efed;
  --flare:#b4534a;
  --flare-soft:#f7e6e3;
  --done:#8b8294;
  --font-display:"Literata", Georgia, "Times New Roman", serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1720; --surface:#251f2c; --ink:#ece6f1; --muted:#b0a6ba; --line:#3a3242;
    --accent:#6cc0b7; --accent-soft:#1f3634; --flare:#e98a80; --flare-soft:#3b2422; --done:#8c8296;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1720; --surface:#251f2c; --ink:#ece6f1; --muted:#b0a6ba; --line:#3a3242;
  --accent:#6cc0b7; --accent-soft:#1f3634; --flare:#e98a80; --flare-soft:#3b2422; --done:#8c8296;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:20px}
header.top{display:grid;gap:8px;padding-top:8px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700;font-family:var(--font-body)}
p{margin:0}
.lede{color:var(--muted);max-width:62ch}
.status{font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--done);display:inline-block}
.dot.ok{background:var(--accent)}
.dot.busy{background:var(--flare)}
nav.jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.jump a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
nav.jump a:hover,nav.jump a:focus-visible{border-color:var(--accent);outline:none}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px}
.card-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.hint{font-size:.92rem;color:var(--muted)}
/* spoons */
.spoons{display:flex;gap:6px;flex-wrap:wrap}
.spoon{width:34px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:0;color:var(--muted)}
.spoon svg{width:16px;height:30px}
.spoon.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.spoon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spoon-read{font-variant-numeric:tabular-nums;font-weight:700}
/* checklist */
.progress{height:8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0}
.group{display:grid;gap:6px}
.group h3{margin-bottom:2px}
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:8px}
.check:hover{background:var(--bg)}
.check input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--accent)}
.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check.is-done label .t{color:var(--done);text-decoration:line-through}
.check .why{display:block;font-size:.88rem;color:var(--muted)}
.alert{border-left:4px solid var(--flare);background:var(--flare-soft);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.alert ul{margin:0;padding-left:20px}
/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.95rem}
.field .hint{font-weight:400}
textarea,input[type=text],input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.logrow{display:grid;grid-template-columns:150px 90px 1fr 1fr 40px;gap:8px;align-items:center}
.row-head{font-size:.85rem;color:var(--muted);font-weight:700}
@media (max-width:640px){
  .logrow{grid-template-columns:1fr 1fr 40px}
  .logrow .wide{grid-column:1 / span 2}
  .logrow.row-head{display:none}
}
button.btn{font:inherit;font-size:.95rem;border-radius:8px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.x{font:inherit;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
button.x:hover{color:var(--flare);border-color:var(--flare)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
footer{font-size:.88rem;color:var(--muted);display:grid;gap:6px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.progress span{transition:width .3s ease}
</style>
</head>
<body>
<div id="root" class="wrap"><p>Loading the flare plan…</p></div>
<script id="state" type="application/json">{"spoons":3,"checks":{},"plan":{"signs":"Waking up achy all over, like the flu. Snapping at small things. Forgetting words.","triggers":"Weeks of stress, a big day of cleaning or travel, cold rainy weather.","helps":"1. Love, Compassion, Communication and asking what they need as well as telling them how you are feeling\n2. Heating pad, a weighted blanket \n3. Ask if there's anything needed handled such as appointments canceled, a note to other family","dont":"Please don't suggest pushing through or ask \"are you sure it's that bad?\"","signal":"\"Low spoons\" or a text with a spoon emoji","touch":"Ask first. Hand squeezes are usually OK; hugs may hurt.","meds":"Example: take only as prescribed. Ask the pharmacist if unsure.","comfort":"Heating pad: hall closet. Eye mask and earplugs: nightstand.","foods":"Soup in the freezer, toast, yogurt, frozen meals","care":"Example: Dr. Name, clinic phone 555-0100","backup":"Example: sister (text first), neighbor for school pickup"},"tasks":[{"task":"Dinner","who":"Partner"},{"task":"School pickup","who":"Grandma"},{"task":"Dog walks","who":"Teen"}],"log":[{"date":"2026-10-03","level":"7","trigger":"Long work week + cold front","notes":"Lasted about 2 weeks. Heat and early nights helped."}],"updated":"2026-11-18T18:45:47.200Z"}</script>
<script id="app">
(function(){
  "use strict";
  var CHECKS = [
    {group:"First hour", items:[
      ["ask","Ask: \"How bad is it, 0 to 10, and what do you need most?\"","Then follow their lead."],
      ["believe","Say you believe them. Skip the debate.","Disbelief makes pain and stress worse."],
      ["plan","Open the flare plan below and check their go-to comforts.",""],
      ["meds","Bring their usual medicine, water and an easy snack within reach.","Only what their care team has prescribed or approved."],
      ["heat","Offer heat: a heating pad, warm bath or warm blanket.",""],

    {group:"Take things off their plate", items:[

    ]},
    {group:"Comfort and connection", items:[
      ["touch","Ask before touching. A hand squeeze may be fine when a hug hurts.",""],

    ]},
    {group:"Each day of the flare", items:[

      ["gentle","Offer gentle stretching or a short walk only if they want it.",""],
      ["log","Add a line to the flare log: date, how bad, possible triggers.",""],

      ["you","Take a break for yourself. Ask someone else to cover a shift.",""]
    ]}
  ];
  var PLAN_FIELDS = [
    ["signs","Early warning signs","What tells them (or you) a flare is starting?"],
    ["triggers","Known triggers","Stress, overdoing it, weather, poor sleep, illness…"],
    ["helps","What helps most","Their top three comforts, in order."],
    ["dont","Please don't","Words or actions that make things worse."],
    ["signal","How they'll tell you","A code word or text that means \"I'm flaring.\""],

    ["meds","Medicines, as prescribed","Names and instructions from their prescriptions only."],
    ["comfort","Comfort items and where they are","Heating pad, eye mask, earplugs, favorite blanket."],
    ["foods","Easy foods to keep on hand","Things that need little or no cooking."],
    ["care","Care team contacts","Doctor or clinic name and phone, pharmacy."],

  ];

  var state;
  try { state = JSON.parse(document.getElementById("state").textContent); } catch(e){ state = {}; }
  state.checks = state.checks || {}; state.plan = state.plan || {}; state.tasks = state.tasks || []; state.log = state.log || [];
  if (typeof state.spoons !== "number") state.spoons = 6;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  var spoonSvg = '<svg viewBox="0 0 16 30" aria-hidden="true"><ellipse cx="8" cy="6" rx="5.5" ry="5.5" fill="currentColor"/><rect x="6.6" y="10" width="2.8" height="19" rx="1.4" fill="currentColor"/></svg>';

  function statusText(){

  function render(){

    var h = [];
    h.push('<header class="top"><h1>Fibro Flare Plan</h1>');

    for (var j=0;j<4;j++) p.push('<tr><td>&nbsp;</td><td></td><td></td><td></td></tr>');
    p.push('</table><p class="why" style="margin-top:12px">General information, not medical advice. Use only medicines as prescribed. Printed ' + esc(new Date().toLocaleDateString()) + '.</p>');
    p.push('<scr' + 'ipt>window.addEventListener("load",function(){setTimeout(function(){try{window.print()}catch(e){}},300)});</scr' + 'ipt></body></html>');
    return p.join("");
  }

  // Build a complete document from the current state (never from the live DOM).
  function buildDoc(){
    var css = document.getElementById("app-style").textContent;
    var js = document.getElementById("app").textContent;
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Fibro Flare Plan</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">\n' +
      '<style id="app-style">' + css + '</style>\n</head>\n<body>\n<div id="root" class="wrap"><p>Loading the flare plan…</p></div>\n' +
      '<script id="state" type="application/json">' + json + '</scr' + 'ipt>\n<script id="app">' + js + '</scr' + 'ipt>\n</body>\n</html>\n';
  }

  var timer = null;
  function setStatus(html){ var el = document.getElementById("status"); if (el) el.innerHTML = html; }
  function save(delay){
    if (mode === "readonly") return;
    if (mode === "local" || mode === "loading"){
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
      return;
    }
    clearTimeout(timer);
    setStatus('<span class="dot busy"></span>Saving…');
    timer = setTimeout(function(){
      state.updated = new Date().toISOString();
      artifactApi.publish(buildDoc()).then(function(){ /* every view reloads to the new version */ }).catch(function(err){
        var code = (err && (err.code || err.name)) || "";
        if (code === "not_granted" || code === "not_writer"){ mode = "readonly"; render(); }
        else if (code === "conflict"){ setStatus('<span class="dot"></span>Someone else saved at the same time. The page will reload with their version.'); }
        else { setStatus('<span class="dot busy"></span>Couldn\'t save just now. Try again in a moment.'); }
      });
    }, delay == null ? 1500 : delay);
  }

  var root = document.getElementById("root");
  root.addEventListener("click", function(e){
    var t = e.target.closest("button, input");
    if (!t || t.disabled) return;
    if (t.id === "print-copy"){
      if (!downloadsApi) return;
      var hint = document.getElementById("print-hint");
      downloadsApi.save({filename:"fibro-flare-checklist.html", data:buildPrintable()}).then(function(){
        if (hint) hint.textContent = "Saved. Open fibro-flare-checklist.html and the print dialog will appear.";
      }).catch(function(err){
        var c = err && err.code;
        if (hint) hint.textContent = c === "declined" ? "Download cancelled." : (c === "rate_limited" ? "A download prompt is already open. Try again in a moment." : "Couldn\u2019t download here. Use Export \u2192 PDF in the family guide instead.");
      });
      return;
    }
    if (t.dataset.spoon){ state.spoons = parseInt(t.dataset.spoon, 10); render(); save(); return; }
    if (t.id === "clear-checks"){ state.checks = {}; render(); save(400); return; }
    if (t.id === "add-task"){ state.tasks.push({task:"", who:""}); render(); var el = document.getElementById("t-task-" + (state.tasks.length-1)); if (el) el.focus(); return; }
    if (t.dataset.delTask != null){ state.tasks.splice(+t.dataset.delTask, 1); render(); save(); return; }
    if (t.id === "add-log"){ state.log.unshift({date:new Date().toISOString().slice(0,10), level:"", trigger:"", notes:""}); render(); var d = document.getElementById("l-level-0"); if (d) d.focus(); save(3000); return; }
    if (t.dataset.delLog != null){ state.log.splice(+t.dataset.delLog, 1); render(); save(); return; }
  });
  root.addEventListener("change", function(e){
    var t = e.target;
    if (t.dataset.check){ state.checks[t.dataset.check] = t.checked; t.closest(".check").classList.toggle("is-done", t.checked); updateProgress(); save(2500); return; }
    if (t.dataset.plan){ state.plan[t.dataset.plan] = t.value; save(); return; }
    if (t.dataset.task != null){ state.tasks[+t.dataset.task][t.dataset.k] = t.value; save(); return; }
    if (t.dataset.log != null){ state.log[+t.dataset.log][t.dataset.k] = t.value; save(); return; }
  });
  function updateProgress(){
    var total=0, done=0; CHECKS.forEach(function(g){ g.items.forEach(function(it){ total++; if (state.checks[it[0]]) done++; }); });
    var bar = root.querySelector(".progress span"); if (bar) bar.style.width = Math.round(done/total*100) + "%";
    var read = root.querySelector("#checklist .card-head .spoon-read"); if (read) read.textContent = done + " of " + total;
  }

  render();

  // Light up shared saving when the page runs as a published artifact.
  function goLocal(){ mode = "local"; loadLocal(); render(); }
  function init(tries){
    var c = window.claude;
    if (!c || typeof c.use !== "function"){
      if (tries < 30) { setTimeout(function(){ init(tries + 1); }, 100); } else { goLocal(); }
      return;
    }
    Promise.resolve(c.use("artifact")).then(function(api){
      if (api && typeof api.publish === "function"){ artifactApi = api; mode = "shared"; render(); }
      else { goLocal(); }
    }).catch(goLocal);
  }
  init(0);
  function initDownloads(tries){
    var c = window.claude;
    if (!c || typeof c.use !== "function"){ if (tries < 30) setTimeout(function(){ initDownloads(tries + 1); }, 100); return; }
    Promise.resolve(c.use("downloads")).then(function(api){ if (api && typeof api.save === "function"){ downloadsApi = api; render(); } }).catch(function(){});
  }
  initDownloads(0);
})();
</script>
</body>
</html>
